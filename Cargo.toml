[package]
name = "login-base"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.6", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.4", features = ["cors"] }

[dev-dependencies]
hyper = "0.14"
tower = "0.4"
